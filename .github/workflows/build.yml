name: Build Analyze and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: build/
